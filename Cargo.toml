[workspace]
resolver = "3"
members = ["crates/puzzle-schema", "crates/evaluator", "services/api", "tools/puzzle-linter"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
http-body-util = "0.1"
